<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="rr-architecture-title rr-architecture-desc">
<title id="rr-architecture-title">RallyRoom: a local authority for a shared rescue</title>
<desc id="rr-architecture-desc">Twitch sends authorized read-only chat events to a local adapter. Exact commands enter a deterministic engine. Authenticated owner and moderator controls enter through session and CSRF checks. A private bounded journal preserves state. The OBS browser overlay receives aggregate snapshots and cannot submit actions. Simulated fixtures use a separate authenticated simulation mode. Live Twitch and OBS evidence remain pending.</desc>
<defs><marker id="rr-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4d6271"/></marker><marker id="rr-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#22645d"/></marker></defs>
<rect width="1280" height="720" fill="#faf5e9"/>
<text x="48" y="60" class="eyebrow">RALLYROOM / IMPLEMENTED ARCHITECTURE</text>
<text x="48" y="108" font-family="Georgia,serif" font-size="38" fill="#15283e">A local authority. A shared rescue.</text>
<text x="48" y="140" class="sub">One persistent Node process owns the mission. Chat can request only six exact command forms.</text>
<!-- Trust zones precede paths and nodes. -->
<rect x="356" y="184" width="584" height="484" rx="8" fill="#f1ede2" stroke="#bdc8c2" stroke-dasharray="6 5"/>
<rect x="376" y="176" width="284" height="24" fill="#faf5e9"/><text x="384" y="193" class="eyebrow">LOCAL SERVER / 127.0.0.1 ONLY</text>
<!-- Paths, with distinct ports and no transit behind nodes. -->
<path d="M300 292H388" fill="none" stroke="#22645d" stroke-width="2" marker-end="url(#rr-link)"/>
<path d="M612 292H664" fill="none" stroke="#4d6271" stroke-width="2" marker-end="url(#rr-arrow)"/>
<path d="M900 292H984" fill="none" stroke="#22645d" stroke-width="2" marker-end="url(#rr-link)"/>
<path d="M784 352V468" fill="none" stroke="#4d6271" stroke-width="2" marker-end="url(#rr-arrow)"/>
<path d="M300 528H388" fill="none" stroke="#4d6271" stroke-width="2" marker-end="url(#rr-arrow)"/>
<path d="M612 516H628Q636 516 636 508V396Q636 388 644 388H724Q732 388 732 380V352" fill="none" stroke="#4d6271" stroke-width="2" marker-end="url(#rr-arrow)"/>
<!-- A forbidden write stops before the server trust boundary. -->
<path d="M1108 352V400Q1108 408 1100 408H960" fill="none" stroke="#a44921" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M952 400 968 416M968 400 952 416" stroke="#a44921" stroke-width="3"/>
<!-- Labels sit clear of their strokes. -->
<rect x="304" y="257" width="80" height="22" fill="#faf5e9"/><text x="344" y="273" class="arrow-label" text-anchor="middle">EVENTSUB</text>
<rect x="612" y="257" width="52" height="22" fill="#f1ede2"/><text x="638" y="273" class="arrow-label" text-anchor="middle">EXACT</text>
<rect x="904" y="257" width="76" height="22" fill="#faf5e9"/><text x="942" y="273" class="arrow-label" text-anchor="middle">SNAPSHOT</text>
<rect x="796" y="397" width="100" height="22" fill="#f1ede2"/><text x="804" y="413" class="arrow-label">ATOMIC LOG</text>
<rect x="304" y="493" width="80" height="22" fill="#faf5e9"/><text x="344" y="509" class="arrow-label" text-anchor="middle">SESSION</text>
<rect x="644" y="412" width="112" height="22" fill="#f1ede2"/><text x="652" y="428" class="arrow-label">CHECKED ROLE</text>
<rect x="972" y="425" width="192" height="28" fill="#faf5e9"/><text x="984" y="445" class="sub" fill="#a44921">Writes blocked</text>
<!-- Nodes -->
<g><rect x="48" y="232" width="252" height="120" rx="6" fill="#eee9dc" stroke="#8b9b9f"/><text x="68" y="261" class="eyebrow">EXTERNAL / UNTRUSTED TEXT</text><text x="68" y="295" class="node-name">Twitch chat</text><text x="68" y="325" class="tech">channel.chat.message v1</text></g>
<g><rect x="388" y="232" width="224" height="120" rx="6" fill="#fffdf7" stroke="#15283e"/><text x="408" y="261" class="eyebrow">AUTHORIZED USER TOKEN</text><text x="408" y="295" class="node-name">Chat adapter</text><text x="408" y="325" class="tech">user:read:chat</text></g>
<g><rect x="664" y="232" width="236" height="120" rx="6" fill="#ffe1c7" stroke="#a44921" stroke-width="2"/><text x="684" y="261" class="eyebrow">SINGLE GAME AUTHORITY</text><text x="684" y="295" class="node-name">Mission engine</text><text x="684" y="325" class="sub">Dedup · roles · cooldowns</text></g>
<g><rect x="984" y="232" width="248" height="120" rx="6" fill="#e3efdf" stroke="#22645d"/><text x="1004" y="261" class="eyebrow">READ-ONLY VIEW</text><text x="1004" y="295" class="node-name" style="font-size:18px">OBS browser overlay</text><text x="1004" y="325" class="tech">/overlay · WebSocket</text></g>
<g><rect x="48" y="468" width="252" height="120" rx="6" fill="#eee9dc" stroke="#8b9b9f"/><text x="68" y="497" class="eyebrow">LOCAL CONTROLLER</text><text x="68" y="531" class="node-name">Owner / moderator</text><text x="68" y="561" class="sub">Key or validated Twitch ID</text></g>
<g><rect x="388" y="468" width="224" height="120" rx="6" fill="#fffdf7" stroke="#15283e"/><text x="408" y="497" class="eyebrow">PRIVILEGED GATE</text><text x="408" y="531" class="node-name">Control API</text><text x="408" y="561" class="sub">Origin · CSRF · permissions</text></g>
<g><rect x="664" y="468" width="236" height="120" rx="6" fill="#e9e6db" stroke="#4d6271"/><text x="684" y="497" class="eyebrow">PRIVATE LOCAL STORAGE</text><text x="684" y="531" class="node-name">Bounded journal</text><text x="684" y="561" class="sub">Snapshots + accepted actions</text></g>
<!-- Substantive scope annotations, no footer strip. -->
<text x="984" y="506" class="eyebrow">EXPLICIT MODES</text><text x="984" y="537" class="sub">Live / simulation / replay</text><text x="984" y="564" class="sub">Synthetic input stays labeled.</text><text x="984" y="606" class="eyebrow">EVIDENCE STATUS</text><text x="984" y="634" class="sub">Real Twitch / OBS capture pending.</text>
<text x="388" y="629" class="sub">Disconnects pause the mission. Tokens stay on the server.</text>
</svg></main></body></html>
